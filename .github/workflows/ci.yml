name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check HTML validity
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tidy
          tidy -e index.html 2>&1 || true
